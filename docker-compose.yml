services:
  redis:
    image: redis:7-alpine
    container_name: promo-redis
    # Volta sozinho quando o Docker Desktop abre (depois de reiniciar o notebook, por exemplo).
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    # Persiste o stream em disco para sobreviver a um restart do container.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-dados:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Banco local: os testes automáticos usam ele, e ele guarda a cópia de antes da
  # migração. O banco oficial do bot agora é o Supabase (ver docs/banco.md).
  postgres:
    image: postgres:16
    container_name: promo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-promo}
      POSTGRES_DB: ${POSTGRES_DB:-promo}
      # Sem valor padrão de propósito: a senha vem só do .env, que não vai para o Git.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (veja .env.example)}
    # Só nesta máquina: a porta não fica exposta na rede da empresa.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-dados:/var/lib/postgresql/data
      # Aplicado automaticamente só na primeira subida, com o volume ainda vazio.
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-dados:
  postgres-dados:
